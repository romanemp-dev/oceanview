<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oceanview — M-rig camera demo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e141a; font-family: -apple-system, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud {
      position: fixed; left: 16px; top: 16px; color: #cfe6ef; font-size: 13px;
      background: rgba(14, 20, 26, 0.7); padding: 10px 14px; border-radius: 10px; line-height: 1.5;
    }
    .hud b { color: #fff; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="err" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:70vw;background:#3a1d1d;color:#ffd7d7;padding:16px 20px;border-radius:12px;font:13px/1.5 -apple-system,sans-serif;white-space:pre-wrap;"></div>
  <script>
    window.addEventListener('error', (e) => {
      const box = document.getElementById('err');
      box.style.display = 'block';
      box.textContent = 'Scene failed to load:\n' + (e.message || e.error?.message || e.error || 'unknown error');
    });
  </script>
  <div class="hud">
    <b>M-rig demo</b> — move the cursor: yaw ±15°, pitch anchors (top = straight into the window, bottom = desk fills ~90%), dead zone 12%, smoothed lerp.<br>
    Welcome drift plays on load (~1.5 s) and is interrupted by any input.
  </div>
  <script type="module">
    import * as THREE from '../vendor/three/three.module.js';
    import { createCameraRig } from '../src/visual/camera-rig.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b7cf);

    // Reference markers: window (far), windowsill, desk (near).
    const windowPane = new THREE.Mesh(
      new THREE.PlaneGeometry(1.4, 0.96),
      new THREE.MeshBasicMaterial({ color: 0xdff1f8 }),
    );
    windowPane.position.set(0, 1.45, -0.62);
    scene.add(windowPane);
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(1.46, 1.02, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x8a6a4a }),
    );
    frame.position.set(0, 1.45, -0.68);
    scene.add(frame);
    // Windowsill between the window and the desk (future trinkets live here).
    const sill = new THREE.Mesh(
      new THREE.BoxGeometry(1.44, 0.04, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x6f5540, roughness: 0.6 }),
    );
    sill.position.set(0, 0.95, -0.55);
    scene.add(sill);
    const desk = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.08, 1.12),
      new THREE.MeshStandardMaterial({ color: 0xb28a5f }),
    );
    desk.position.set(0, 0.72, 0.28);
    scene.add(desk);
    // Stacks on a semicircle around the viewer: left/right are as close as center.
    for (let i = 0; i < 5; i++) {
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.02, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xc0392b }),
      );
      const t = i / 4;
      const angle = (-30 + t * 60) * (Math.PI / 180);
      marker.position.set(Math.sin(angle) * 0.8, 0.79, 0.95 - Math.cos(angle) * 0.8);
      scene.add(marker);
    }

    scene.add(new THREE.HemisphereLight(0xfff2e0, 0x6b5a48, 1.0));
    const sun = new THREE.DirectionalLight(0xffe6c0, 1.7);
    sun.position.set(-1.0, 2.0, -0.8);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(55, 2, 0.02, 40);
    camera.position.set(0, 1.18, 0.95);
    camera.lookAt(0, 1.18, 0);

    const rig = createCameraRig({ camera, domElement: canvas });
    rig.attach();

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function loop(now) {
      rig.tick(now);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
